[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-energy-environments"
version = "0.1.0"
description = "Energy system simulation environments for mango-agents"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["energy", "simulation", "multi-agent", "power-systems", "restoration"]
dependencies = [
    "mango-agents>=2.1",
    "monee>=1.0",
    "pandapower>=2.9.0",
    "networkx>=3.0",
    "pandas>=1.5.3",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
pypsa = ["pypsa>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pypsa>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PIE"]
ignore = ["E501"]
